enum Priority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

enum TicketStatus {
  OPEN
  IN_PROGRESS
  RESOLVED
  CLOSED
}

type Ticket {
  id: ID!
  title: String!
  description: String!
  priority: Priority!
  status: TicketStatus!
  reporter: User!
  assignee: User
  createdAt: DateTime!
  updatedAt: DateTime!
  firstResponseAt: DateTime
  resolvedAt: DateTime
  sla: SLAInfo!
  comments: [Comment!]!
}

type TicketConnection {
  nodes: [Ticket!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input CreateTicketInput {
  title: String!
  description: String!
  priority: Priority!
}

extend type Query {
  tickets(
    status: TicketStatus
    priority: Priority
    assigneeId: ID
    slaState: SLAState
    take: Int
    cursor: String
  ): TicketConnection!

  ticket(id: ID!): Ticket
}

extend type Mutation {
  createTicket(input: CreateTicketInput!): Ticket!
  assignTicket(ticketId: ID!, assigneeId: ID!): Ticket!
  changeTicketStatus(ticketId: ID!, status: TicketStatus!): Ticket!
  resolveTicket(ticketId: ID!): Ticket!
}
